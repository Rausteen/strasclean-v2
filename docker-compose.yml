# ─────────────────────────────────────────────────────────────────────────
#  StrasClean — docker compose
#
#  Lance le site avec :
#    docker compose up -d --build
#
#  Le build inline les NEXT_PUBLIC_* depuis .env (voir .env.example).
#  Les données persistantes (DB SQLite, photos uploadées) sont stockées
#  hors du container dans ./data et ./uploads-* via des bind mounts.
# ─────────────────────────────────────────────────────────────────────────

services:
  strasclean:
    container_name: strasclean
    build:
      context: .
      dockerfile: Dockerfile
      # Passe les vars NEXT_PUBLIC_* en build args pour qu'elles soient
      # inlinées dans le bundle JS (Next.js inline les NEXT_PUBLIC_* à
      # build-time, pas à runtime).
      args:
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_GOOGLE_ADS_AUTO_ID: ${NEXT_PUBLIC_GOOGLE_ADS_AUTO_ID:-}
        NEXT_PUBLIC_GOOGLE_ADS_AUTO_WA_LABEL: ${NEXT_PUBLIC_GOOGLE_ADS_AUTO_WA_LABEL:-}
        NEXT_PUBLIC_GOOGLE_ADS_AUTO_PHONE_LABEL: ${NEXT_PUBLIC_GOOGLE_ADS_AUTO_PHONE_LABEL:-}
        NEXT_PUBLIC_GOOGLE_ADS_MAISON_ID: ${NEXT_PUBLIC_GOOGLE_ADS_MAISON_ID:-}
        NEXT_PUBLIC_GOOGLE_ADS_MAISON_WA_LABEL: ${NEXT_PUBLIC_GOOGLE_ADS_MAISON_WA_LABEL:-}
        NEXT_PUBLIC_GOOGLE_ADS_MAISON_PHONE_LABEL: ${NEXT_PUBLIC_GOOGLE_ADS_MAISON_PHONE_LABEL:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}

    ports:
      # ⚠️ Bind sur 127.0.0.1 uniquement : le port n'est PAS exposé
      # publiquement. Tout passe par Caddy (réseau "web" ci-dessous)
      # qui termine le HTTPS et reverse-proxy vers strasclean:3000.
      # Pratique aussi pour debug local : curl http://localhost:3000
      # depuis le VPS reste possible.
      - "127.0.0.1:3000:3000"

    # Secrets runtime (clé Google Places API, session secret admin, etc.)
    # → mets-les dans un fichier .env (gitignored) à la racine.
    env_file:
      - .env

    # Variables d'environnement runtime
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0

    # Réseau partagé avec Caddy. Le service Caddy résoudra ce container
    # via son nom DNS interne : `reverse_proxy strasclean:3000`.
    networks:
      - web

    # Volumes persistants — survivent à `docker compose down`
    volumes:
      # DB SQLite (analytics, avis cachés, demandes RDV, tags d'avis)
      - ./data:/app/data
      # ⚠️ Bind mounts photos commentés tant qu'on n'a pas de vraies
      # photos à uploader. Un dossier hôte vide MASQUE les placeholders
      # baked-in dans l'image (qui sont des gradients CSS).
      # Pour réactiver : crée les dossiers + upload des .webp, puis
      # décommente + docker compose up -d --build.
      # - ./public/avant-apres:/app/public/avant-apres
      # - ./public/maison/before-after:/app/public/maison/before-after
      # - ./public/maison/hero:/app/public/maison/hero

    restart: unless-stopped

    # Healthcheck — Next standalone répond sur / dès qu'il est prêt
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Limites de ressources (ajuste selon ton VPS)
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

# Réseau partagé avec Caddy. Déclaré external = créé hors de ce compose
# (par Caddy ou manuellement avec : docker network create web).
networks:
  web:
    external: true
