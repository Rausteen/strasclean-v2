<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Fond sombre cohérent avec le site -->
  <rect width="1024" height="1024" fill="#05070A"/>

  <!-- Icône (rectangle arrondi + étoile 4 branches) -->
  <g transform="translate(352 200)">
    <rect width="320" height="320" rx="72" fill="url(#g)"/>
    <path
      d="M160 70 L180 150 L260 160 L180 170 L160 250 L140 170 L60 160 L140 150 Z"
      fill="#05070A"
    />
  </g>

  <!-- Texte StrasClean -->
  <text
    x="512" y="700"
    text-anchor="middle"
    font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="800"
    font-size="124"
    letter-spacing="-4"
    fill="#ffffff"
  >
    Stras<tspan fill="#34D399">Clean</tspan>
  </text>

  <!-- Baseline tagline (discrète) -->
  <text
    x="512" y="780"
    text-anchor="middle"
    font-family="Inter, system-ui, sans-serif"
    font-weight="500"
    font-size="34"
    letter-spacing="6"
    fill="#9CA3AF"
  >
    NETTOYAGE  AUTO  À  DOMICILE
  </text>
</svg>
